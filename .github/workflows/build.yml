name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project WebcamViewer.xcodeproj \
            -scheme WebcamViewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/WebcamViewer.app" Payload/
          zip -r WebcamViewer.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebcamViewer-ipa
          path: WebcamViewer.ipa
